<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sign In — BRUTAL</title>

    <link rel="stylesheet" href="account.css">
</head>

<body>

    <main class="account-page">

        <a href="index.html" class="account__logo">
            BRUTAL
        </a>

        <div class="account__card">

            <div class="account__header">
                <span class="account__eyebrow">
                    WELCOME BACK
                </span>

                <h1>
                    Ready for
                    <span>the truth?</span>
                </h1>

                <p>
                    Sign in and get back to getting your
                    fuckin' act together.
                </p>
            </div>


            <form class="account__form">

                <div class="form__group">
                    <label for="email">Email</label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="you@example.com"
                        required
                    >
                </div>


                <div class="form__group">
                    <div class="password__label">

                        <label for="password">
                            Password
                        </label>

                        <a href="#">
                            Forgot password?
                        </a>

                    </div>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Your password"
                        required
                    >
                </div>


                <label class="checkbox">
                    <input type="checkbox">

                    <span>
                        Keep me signed in
                    </span>
                </label>


                <button type="submit" class="account__button">
                    Sign In →
                </button>

            </form>


            <div class="account__footer">

                <p>
                    Don't have an account?
                    <a href="createaccount.html">
                        Create one
                    </a>
                </p>

            </div>

        </div>


        <a href="index.html" class="back-home">
            ← Back to BRUTAL
        </a>

    </main>
<script>
    window.BRUTAL_API_URL = "https://brutal-backend.onrender.com";
</script>

<script src="auth.js"></script>
</body>
</html>

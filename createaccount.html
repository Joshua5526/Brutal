<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Create Account — BRUTAL</title>

    <link rel="stylesheet" href="account.css">
</head>

<body>

    <main class="account-page">

        <a href="index.html" class="account__logo">
            BRUTAL
        </a>

        <div class="account__card">

            <div class="account__header">
                <span class="account__eyebrow">
                    WELCOME TO BRUTAL
                </span>

                <h1>
                    Create your
                    <span>account.</span>
                </h1>

                <p>
                    Get ready to hear what you need to hear,
                    not what you want to hear.
                </p>
            </div>


            <form class="account__form">

                <div class="form__group">
                    <label for="name">Name</label>

                    <input
                        type="text"
                        id="name"
                        name="name"
                        placeholder="Your name"
                        required
                    >
                </div>


                <div class="form__group">
                    <label for="email">Email</label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="you@example.com"
                        required
                    >
                </div>


                <div class="form__group">
                    <label for="password">Password</label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Create a password"
                        required
                    >
                </div>


                <div class="form__group">
                    <label for="confirm-password">
                        Confirm Password
                    </label>

                    <input
                        type="password"
                        id="confirm-password"
                        name="confirm-password"
                        placeholder="Enter your password again"
                        required
                    >
                </div>


                <label class="checkbox">
                    <input type="checkbox" required>

                    <span>
                        I agree to the terms and understand that
                        BRUTAL is, well... brutal.
                    </span>
                </label>


                <button type="submit" class="account__button">
                    Create Account →
                </button>

            </form>


            <div class="account__footer">
                <p>
                    Already have an account?
                    <a href="login.html">Sign in</a>
                </p>
            </div>

        </div>


        <a href="index.html" class="back-home">
            ← Back to BRUTAL
        </a>

    </main>
<script src="auth.js"></script>
</body>
</html>
